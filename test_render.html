<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; background: #07172c; color: white; font-family: sans-serif; padding: 20px; }
.frame {
  background: #ffffff;
  border: 2px solid rgba(56, 189, 248, 0.4);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.frame-bar {
  background: #091c33;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #94b5cb;
  font-size: 13px;
  font-weight: 600;
}
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot-red { background: #ef4444; }
.dot-yellow { background: #f59e0b; }
.dot-green { background: #10b981; }
.frame img {
  width: 100%;
  height: auto;
  display: block;
  background: #ffffff;
}
</style>
</head>
<body>
<h2>Test</h2>
</body>
</html>
